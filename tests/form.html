<!doctype html><html lang="en"><meta charset="utf-8"><title>OpenClaw local capability test</title>
<style>body{font:18px system-ui;max-width:700px;margin:40px auto}label{display:block;margin:18px 0}input,select,button{font:inherit;padding:8px}#step2{display:none}pre{white-space:pre-wrap}</style>
<h1>Local form test</h1><p>Test data only. Nothing is sent to an online account.</p>
<form id="form"><section id="step1">
<label>Full name <input id="name" name="name" required></label>
<label>Email <input id="email" name="email" type="email" required></label>
<label>Category <select id="category" name="category"><option>Personal</option><option>Research</option></select></label>
<label>Date <input id="date" name="date" type="date"></label>
<label><input id="consent" name="consent" type="checkbox"> Test consent</label>
<button id="next" type="button">Next step</button></section>
<section id="step2"><h2>Attachments</h2><label>Upload test file <input id="upload" name="upload" type="file"></label>
<div id="dynamic"></div><button type="submit">Finish test</button></section></form>
<pre id="result" aria-live="polite"></pre><a id="download" download="openclaw-test.txt" href="data:text/plain,OpenClaw%20download%20verified%0A">Download test file</a>
<script>
document.querySelector('#next').onclick=()=>{document.querySelector('#step1').style.display='none';document.querySelector('#step2').style.display='block';setTimeout(()=>{document.querySelector('#dynamic').innerHTML='<label>Dynamic note <input id="note" name="note"></label>'},100)};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.upload=d.upload.name;document.querySelector('#result').textContent=JSON.stringify(d,null,2)};
</script></html>
