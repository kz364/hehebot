    "/triggers/{source_id}": {
      "post": {
        "operationId": "acceptTrigger",
        "security": [
          {
            "WebhookSignature": []
          }
        ],
        "parameters": [
          {
            "name": "source_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "X-Event-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          {
            "name": "X-Timestamp",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "description": "Unix seconds; within 300 seconds of server time"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "schema_version": {
                    "const": 1
                  },
                  "type": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80
                  },
                  "data": {
                    "type": "object"
                  }
                },
                "required": [
                  "schema_version",
                  "type",
                  "data"
                ]
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Verified event accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "400": {
            "description": "Stable error envelope",
            "content": {
              "application/json": {
