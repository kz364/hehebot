        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./contracts.json"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Durably accepted; not necessarily executed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "400": {
