    "/conversations/{conversation_id}/events": {
      "get": {
        "operationId": "conversationEvents",
        "parameters": [
          {
            "name": "conversation_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "before",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Up to 100 events ascending, before_cursor and has_more."
          },
          "404": {
            "description": "Conversation unavailable."
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "OwnerSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "CF_Authorization"
      },
      "WebhookSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Signature",
        "description": "hex HMAC-SHA256 over timestamp + newline + event ID + newline + exact raw body; per-source secret, constant-time compare"
      }
    },
    "schemas": {
      "Receipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "accepted",
              "applied",
              "rejected"
            ]
          },
          "accepted_at": {
            "type": "string",
            "format": "date-time"
          },
          "resource_id": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "error": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80
                  },
                  "message": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 500
                  },
                  "retryable": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "code",
                  "message",
                  "retryable"
                ]
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "id",
          "status",
          "accepted_at",
          "resource_id",
          "error"
        ]
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "minLength": 1,
                "maxLength": 80
              },
              "message": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500
              },
              "retryable": {
                "type": "boolean"
              }
            },
            "required": [
              "code",
              "message",
              "retryable"
            ]
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "error",
          "request_id"
        ]
      },
      "State": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "next_cursor": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "snapshot_required": {
            "type": "boolean"
          },
          "events": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "sequence": {
                  "type": "integer",
                  "minimum": 1
                },
                "type": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 80
                },
                "entity_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "created_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "data": {
                  "type": "object"
                }
              },
              "required": [
                "sequence",
                "type",
                "entity_id",
                "created_at",
                "data"
              ]
            }
          },
          "summary": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "phase": {
                "enum": [
                  "STOPPED",
                  "START_REQUESTED",
                  "BOOTING",
                  "READY",
                  "DRAINING",
                  "STOP_COMMITTED",
                  "STOPPING",
                  "RECOVERY_REQUIRED"
                ]
              },
              "queued_runs": {
                "type": "integer",
                "minimum": 0
              },
              "blocked_runs": {
                "type": "integer",
                "minimum": 0
              }
            },
            "required": [
              "phase",
              "queued_runs",
              "blocked_runs"
            ]
          }
        },
        "required": [
          "next_cursor",
          "snapshot_required",
          "events",
          "summary"
        ]
      }
    }
  }
}
